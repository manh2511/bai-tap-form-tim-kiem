<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
</head>
<body>

    <h1>Tìm kiếm với Google</h1>

    <!-- Thẻ form chứa thuộc tính action kết nối tới Google Search và method GET -->
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa" />
        <input type="submit" value="Tìm kiếm" />
    </form>

</body>
</html>
